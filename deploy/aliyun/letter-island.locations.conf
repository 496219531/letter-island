location = /letter-island { return 302 /letter-island/; }
location = /letter-island/api/speech/status {
    default_type application/json;
    return 200 '{"available":false,"error":"云端暂不提供系统语音识别服务"}';
}
location ^~ /letter-island/api/speech/ {
    default_type application/json;
    return 403 '{"error":"云端暂不提供系统语音识别服务"}';
}
location = /letter-island/api/library/organize {
    proxy_pass http://127.0.0.1:4174/api/library/organize;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 135s;
    proxy_send_timeout 135s;
    client_max_body_size 12m;
    access_log off;
}
location = /letter-island/api/library/share {
    proxy_pass http://127.0.0.1:4174/api/library/share;
