<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配音小能手</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#142c20;color:#fff2c3;font:17px/1.7 system-ui,sans-serif}main{max-width:580px;margin:5vh auto}h1{font-size:30px}p{color:#ccd6bf}select{font:inherit;padding:10px;border-radius:10px;max-width:100%}button,a.action{display:inline-block;padding:12px 18px;margin:8px 8px 8px 0;border:1px solid #d1bd79;border-radius:14px;background:#ffda83;color:#24351e;font:inherit;text-decoration:none;cursor:pointer}button:disabled{opacity:.45;cursor:default}audio{width:100%;margin:20px 0}a{color:#ffda83}#status{min-height:3.5em}#stop{background:#f1a88b}[hidden]{display:none!important}</style>
<main><a href="index.html">← 返回游戏</a><h1>🎙 配音小能手</h1><p>给小院配上你的声音！选一种音效，录音、试听，再替换。每种声音都能随时恢复默认。</p><label for="kind">我要配音：</label><select id="kind"></select><p id="hint"></p><button id="original">听听原版</button><button id="record">开始录音</button><button id="stop" disabled>停止录音</button><p id="status" role="status" aria-live="polite">点击后才会申请麦克风权限。录音只留在当前浏览器，不上传。</p><audio id="preview" controls hidden></audio><div><button id="save" disabled>使用这段配音</button><a id="download" class="action" hidden>下载录音</a><button id="reset">这项恢复默认</button></div><label>或导入录音 <input id="import" type="file" accept="audio/*"></label><p>想让我继续处理音色：下载录音，再把文件发到聊天里。保存后返回游戏即可使用，仅对当前设备、当前浏览器生效。</p></main><script src="sound.js"></script><script src="zombie-recorder.js"></script></html>
